# Continuous Integration (CI): GitHub runs these checks on every push and pull request.
# A green check means the code passes. A red X means something needs fixing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run tests (pytest)
        if: hashFiles('tests/*.py') != ''  # skip until the tests/ folder exists (section 2b)
        run: pytest
